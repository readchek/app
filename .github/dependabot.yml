# Weekly updates for the actions CI uses and the web app's packages. Chek Reader is pinned in the Xcode
# project, which Dependabot can't update, so its version moves by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
