name: Deploy demo

# Publishes the demo (the `chek-demo` Worker at demo.chek.page) after every
# push to main that changes the web app. The demo is the web app built with
# `--mode demo`: it answers the API in the browser from the library snapshot
# pinned in web/demo-snapshot.json, so no server runs. Run it from the
# Actions tab to redeploy without a push. It checks the app the way CI's web
# job does first, so a push that fails those checks never goes live.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

# A deploy that has started always finishes, and only the newest waiting
# one runs after it, so an older build can't replace a newer one.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to demo.chek.page
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://demo.chek.page
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      # The snapshot is the same from one deploy to the next until
      # demo-snapshot.json changes, so it's kept rather than downloaded again.
      - uses: actions/cache@v4
        with:
          path: web/demo-data
          key: demo-data-${{ hashFiles('web/demo-snapshot.json') }}
      # wrangler signs in with the token in the environment instead of the
      # browser. The account comes from web/wrangler.demo.jsonc.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN secret in Settings, Secrets and variables, Actions"
            exit 1
          fi
          bun run deploy:demo
