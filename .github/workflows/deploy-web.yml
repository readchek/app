name: Deploy web app

# Publishes the web app to Cloudflare (the `chek-web` Worker at
# app.chek.page) after every push to main that changes it. Run it from the
# Actions tab to redeploy without a push. It checks the app the way CI's web
# job does first, so a push that fails those checks never goes live. The
# admin panel the Chek server bundles is built from main by the server's
# image, not here.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# A deploy that has started always finishes, and only the newest waiting
# one runs after it, so an older build can't replace a newer one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to app.chek.page
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.chek.page
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      # `cf` signs in with the token in the environment instead of the
      # browser. The account comes from web/cloudflare.config.ts.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN secret in Settings, Secrets and variables, Actions"
            exit 1
          fi
          bun run deploy
