name: CI

# Pushes to other branches are covered by their pull request, so running on
# both would build every commit twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The iOS job runs on the maintainers' Mac mini when the SELF_HOSTED_MAC
# repository variable is "true", and on GitHub's runners otherwise. Pull
# requests from forks always use GitHub's runners, so code from outside the
# repository never runs on our machines.
jobs:
  ios:
    name: iOS app
    runs-on: ${{ vars.SELF_HOSTED_MAC == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-mac"]') || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v7
      # Use Xcode 27 wherever it's installed, since the machine's selected
      # developer directory can be the Command Line Tools, which have no
      # xcodebuild.
      - name: Select Xcode 27
        run: |
          if xcodebuild -version 2>/dev/null | grep -q '^Xcode 27'; then
            xcodebuild -version
            exit 0
          fi
          for app in /Applications/Xcode*.app; do
            if "$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | grep -q '^Xcode 27'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              "$app/Contents/Developer/usr/bin/xcodebuild" -version
              exit 0
            fi
          done
          echo "::error::Xcode 27 isn't installed in /Applications"
          exit 1
      # Packages live in a folder of their own outside the workspace, so
      # checkout doesn't delete them and a run only downloads what changed
      # since the last one. Each run used to fetch every package fresh,
      # including the libarchive binary from GitHub Releases, so any GitHub
      # hiccup (a 504 there) failed the job before anything built. The
      # runner's shared SwiftPM repository cache stays off, since it can
      # name clones that are gone.
      - name: Choose the package folder
        run: echo "PACKAGES=$HOME/Library/Caches/ChekCI/app/SourcePackages" >> "$GITHUB_ENV"
      # GitHub's runners start empty, so they keep the folder in the Actions
      # cache instead. The maintainers' Mac keeps it on disk.
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: ~/Library/Caches/ChekCI/app/SourcePackages
          key: spm-${{ hashFiles('apple/Chek.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-
      # Downloads are retried with a pause, and before the last try the
      # folder is cleared in case a half-finished download left it broken.
      - name: Resolve packages
        run: |
          for attempt in 1 2 3 4; do
            if [ "$attempt" -eq 4 ]; then
              echo "::warning::Clearing $PACKAGES before the last try"
              rm -rf "$PACKAGES"
            fi
            if xcodebuild -resolvePackageDependencies -project apple/Chek.xcodeproj -scheme Chek \
              -disablePackageRepositoryCache -clonedSourcePackagesDirPath "$PACKAGES"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Package resolution failed (attempt $attempt of 4), retrying in $((attempt * 20)) seconds"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Packages couldn't be downloaded after 4 tries. GitHub is likely down; re-run the job once it's back."
          exit 1
      # Packages are already resolved, so building and testing don't go
      # back to the network for them.
      - name: Build for iOS Simulator
        run: >
          xcodebuild build -project apple/Chek.xcodeproj -scheme Chek
          -destination 'generic/platform=iOS Simulator'
          -disablePackageRepositoryCache
          -clonedSourcePackagesDirPath "$PACKAGES"
          -skipPackageUpdates
          CODE_SIGNING_ALLOWED=NO
      # Unit tests need a simulator to host the app. An iPhone that isn't
      # booted is preferred, so a simulator someone is using on the
      # maintainers' Mac isn't taken over.
      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = [d for key, ds in json.load(sys.stdin)["devices"].items() if "iOS" in key for d in ds if d["name"].startswith("iPhone")]
          devices.sort(key=lambda d: d["state"] != "Shutdown")
          print(devices[0]["udid"] if devices else "")
          ')
          if [ -z "$UDID" ]; then
            echo "::warning::No iPhone simulator is available, so the unit tests were skipped"
            exit 0
          fi
          xcodebuild test -project apple/Chek.xcodeproj -scheme Chek \
            -destination "id=$UDID" \
            -disablePackageRepositoryCache \
            -clonedSourcePackagesDirPath "$PACKAGES" \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - uses: ./.github/actions/bun-install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
