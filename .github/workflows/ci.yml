name: CI

# Pushes to other branches are covered by their pull request, so running on
# both would build every commit twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The iOS job runs on the maintainers' Mac mini when the SELF_HOSTED_MAC
# repository variable is "true", and on GitHub's runners otherwise. Pull
# requests from forks always use GitHub's runners, so code from outside the
# repository never runs on our machines.
jobs:
  ios:
    name: iOS app
    runs-on: ${{ vars.SELF_HOSTED_MAC == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-mac"]') || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v7
      # Use Xcode 27 wherever it's installed, since the machine's selected
      # developer directory can be the Command Line Tools, which have no
      # xcodebuild.
      - name: Select Xcode 27
        run: |
          if xcodebuild -version 2>/dev/null | grep -q '^Xcode 27'; then
            xcodebuild -version
            exit 0
          fi
          for app in /Applications/Xcode*.app; do
            if "$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | grep -q '^Xcode 27'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              "$app/Contents/Developer/usr/bin/xcodebuild" -version
              exit 0
            fi
          done
          echo "::error::Xcode 27 isn't installed in /Applications"
          exit 1
      # The runner's shared SwiftPM repository cache can name clones that
      # are gone, which fails package resolution before anything builds,
      # so packages are fetched fresh into the workspace instead.
      - name: Build for iOS Simulator
        run: >
          xcodebuild build -project apple/Chek.xcodeproj -scheme Chek
          -destination 'generic/platform=iOS Simulator'
          -disablePackageRepositoryCache
          -clonedSourcePackagesDirPath .build/SourcePackages
          CODE_SIGNING_ALLOWED=NO
      # Unit tests need a simulator to host the app. An iPhone that isn't
      # booted is preferred, so a simulator someone is using on the
      # maintainers' Mac isn't taken over.
      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = [d for key, ds in json.load(sys.stdin)["devices"].items() if "iOS" in key for d in ds if d["name"].startswith("iPhone")]
          devices.sort(key=lambda d: d["state"] != "Shutdown")
          print(devices[0]["udid"] if devices else "")
          ')
          if [ -z "$UDID" ]; then
            echo "::warning::No iPhone simulator is available, so the unit tests were skipped"
            exit 0
          fi
          xcodebuild test -project apple/Chek.xcodeproj -scheme Chek \
            -destination "id=$UDID" \
            -disablePackageRepositoryCache \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
